<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:24px;background:#f6f8f3;color:#243d32;font-family:Arial,'Microsoft YaHei',sans-serif;line-height:1.8">
<div style="max-width:480px;margin:auto;padding:28px;background:#fff;border:1px solid #dfe8d9;border-radius:16px">
  <h1 style="font-size:24px;margin:0 0 16px">验证你的山河足迹邮箱</h1>
  <p>你正在为 <strong>{{ .Email }}</strong> 完成邮箱验证。</p>
  <p>请回到山河足迹，点击“输入邮箱验证码”，填写这封邮件中的 8 位验证码：</p>
  <p style="font-size:32px;letter-spacing:6px;font-weight:bold;color:#2f6b53;background:#f1f6ee;padding:16px;text-align:center;border-radius:10px">{{ .Token }}</p>
  <p>验证码在发送后 <strong>1 小时</strong>内有效，只能成功使用一次。重新发送后，请使用最新邮件中的验证码。</p>
  <p><a href="{{ .SiteURL }}?auth=verify" style="display:inline-block;color:#fff;background:#2f6b53;text-decoration:none;padding:12px 20px;border-radius:8px">打开山河足迹，输入验证码</a></p>
  <p style="font-size:13px;color:#667563">打开网页本身不会完成验证；提交验证码并看到“邮箱验证成功”才表示完成。手机和电脑都可以验证。如邮箱内打开不正常，请回到原来使用的浏览器输入验证码。</p>
  <p style="font-size:12px;color:#7e8978">如果这不是你的操作，请忽略此邮件。不要把验证码发送给他人。</p>
</div>
</body></html>
